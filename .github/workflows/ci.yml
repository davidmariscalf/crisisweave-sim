name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m py_compile simulate.py tests/test_simulate.py
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: |
          python - <<'PY'
          from simulate import generate
          out=generate('mixed',9,42)
          assert len(out)==9
          assert all(e['synthetic'] is True and e['environment']=='simulation' for e in out)
          assert all(e['raw']['synthetic'] is True for e in out)
          assert all(e['source']['url'] is None for e in out)
          assert {e['kind'] for e in out}=={'flood','wildfire','earthquake'}
          PY
